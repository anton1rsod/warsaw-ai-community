<svg viewBox="0 0 1024 512" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Subploters concept 3: story bracket lockup">
  <g id="bg">
    <rect width="1024" height="512" fill="#fef6e6"/>
  </g>
  <g id="wordmark" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Helvetica, Arial, system-ui, sans-serif" font-weight="600" font-size="160" letter-spacing="-4">
    <text x="80" y="300" text-anchor="start" fill="#1a1a2e">Subploters</text>
  </g>
  <g id="mark" transform="rotate(-3 870 270)">
    <!-- Story bracket positioned after the wordmark, sized to match wordmark x-height -->
    <path
      d="M 820 200
         L 920 270
         L 820 340"
      stroke="#f59e0b"
      stroke-width="32"
      stroke-linejoin="round"
      stroke-linecap="round"
      fill="none"
    />
  </g>
  <g id="caption" font-family="ui-monospace, 'JetBrains Mono', 'SF Mono', Menlo, monospace" font-weight="500" font-size="20" fill="#886c37" letter-spacing="3">
    <text x="512" y="400" text-anchor="middle">SUBPLOTERS ⟩ — NARRATIVE CONTINUES</text>
  </g>
</svg>
