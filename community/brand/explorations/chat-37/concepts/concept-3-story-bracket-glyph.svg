<svg viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Subploters concept 3: story bracket glyph">
  <g id="bg">
    <rect width="512" height="512" fill="#fef6e6"/>
  </g>
  <g id="mark" transform="rotate(-3 256 256)">
    <!-- Right angle bracket: two strokes meeting at a point, slightly tilted per brand.md -3° -->
    <path
      d="M 170 110
         L 360 256
         L 170 402"
      stroke="#f59e0b"
      stroke-width="68"
      stroke-linejoin="round"
      stroke-linecap="round"
      fill="none"
    />
  </g>
</svg>
